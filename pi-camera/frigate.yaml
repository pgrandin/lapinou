# Merge this camera into your existing Frigate cameras section.
cameras:
  lapinou:
    ffmpeg:
      hwaccel_args: []
      inputs:
        - path: http://192.168.1.150:8080/snapshot.jpg
          input_args: preset-http-jpeg-generic
          roles: [detect]
    detect:
      enabled: false
      width: 1640
      height: 1232
      fps: 1
    record:
      enabled: false
